name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/irashack/night-desk
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/irashack/night-desk
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Print image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Image digest" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/irashack/night-desk@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o nightdesk ./cmd/nightdesk
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -czf "nightdesk_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" \
            nightdesk LICENSE README.md THIRD_PARTY_NOTICES.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightdesk_${{ matrix.goos }}_${{ matrix.goarch }}
          path: nightdesk_*.tar.gz
          if-no-files-found: error

  release:
    needs: [image, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum nightdesk_*.tar.gz > SHA256SUMS
      - name: Attest tarballs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/nightdesk_*.tar.gz'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          args=()
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --generate-notes \
            "${args[@]}" \
            dist/nightdesk_*.tar.gz dist/SHA256SUMS
